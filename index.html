<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>360° 互動賞車</title>
<style>
  body { margin: 0; background: #f2f3f5; color: #222; text-align: center;
         font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
  h1 { margin: 24px 16px 4px; font-size: 1.6rem; }
  p  { margin: 0 16px 16px; color: #666; }
  /* 播放器寬度跟著這個容器；寬度上限 1100px */
  .viewer { max-width: 1100px; margin: 0 auto 32px; padding: 0 8px; }
</style>
<!-- 載入播放器：spin360.js 與本檔放在同一層 -->
<script type="module" src="spin360.js"></script>
</head>
<body>
  <h1>360° 互動賞車</h1>
  <p>左右拖曳，旋轉觀看車輛</p>
  <div class="viewer">
    <!-- src：照片路徑，{i} 會自動換成編號（注意開頭沒有斜線 /）
         frames：照片張數　pad="2"：編號補成兩位數（00、01…47） -->
    <spin-360 src="images/{i}.jpg" frames="48" pad="2" autoplay speed="6" alt="車輛 360 度照片"></spin-360>
  </div>
</body>
</html>
